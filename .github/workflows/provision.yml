name: provision

on:
  workflow_dispatch:
    inputs:
      host:
        description: "VPS IP address or hostname"
        required: true
      skip_base:
        description: "Skip base packages (curl/git/ufw/etc.) - almost any provider image already has these"
        type: boolean
        default: false
      skip_docker:
        description: "Skip Docker install - check this only if the image already has Docker (not just the base packages)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: provisioning
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: |
            infrastructure/provision
          sparse-checkout-cone-mode: false

      - name: Resolve values
        # One VPS serves both staging and production - see
        # docs/DEPLOYMENT_SETUP.md. Provision for both in a single run:
        # the one shared CI deploy key (docs/DEPLOYMENT_SETUP.md §2.2 - same key deploys both
        # environments), your personal key for manual access (root login
        # gets disabled and the deploy key's private half only lives in
        # GitHub Secrets), and a cert/DNS covering all four app/cdn hostnames.
        run: |
          mkdir -p /tmp/mediscan-provision
          jq -n \
            --arg deploy_key "${{ vars.DEPLOY_SSH_PUBLIC_KEY }}" \
            --arg admin_key "${{ vars.ADMIN_SSH_PUBLIC_KEY }}" \
            --arg cf_token "${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            --argjson deploy_sudo true \
            '{
              deploy_ssh_public_keys: [$deploy_key],
              admin_ssh_public_keys: [$admin_key],
              cloudflare_api_token: $cf_token,
              tls_domains: ["app.mediscan.cloud","staging.mediscan.cloud","cdn.mediscan.cloud","cdnstaging.mediscan.cloud","monitor.mediscan.cloud","monitorstaging.mediscan.cloud"],
              deploy_user_sudo: $deploy_sudo
            }' > /tmp/mediscan-provision/extra-vars.json

      - name: Load SSH key(s)
        # The bootstrap key only authenticates as root, and root login gets
        # permanently disabled by the users role's first successful run
        # (infrastructure/provision/roles/users/tasks/main.yml) - so it only
        # ever works once, on a genuinely fresh VPS. ADMIN_SSH_PRIVATE_KEY
        # (optional) is the private half of ADMIN_SSH_PUBLIC_KEY below,
        # which the users role installs on the sudo-capable `mediscan`
        # user - loading it here lets re-runs against an already-hardened
        # box (e.g. just to reissue the TLS cert for new hostnames) connect
        # as `mediscan` with sudo instead of root. Leave it unset if you'd
        # rather always re-run by hand from your own machine as `mediscan`.
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.PROVISION_SSH_PRIVATE_KEY }}
            ${{ secrets.ADMIN_SSH_PRIVATE_KEY }}

      - name: Set up Python + Ansible
        run: |
          pip install --user ansible
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Ansible collections
        working-directory: infrastructure/provision
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run playbook
        working-directory: infrastructure/provision
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ inputs.host }}" >> ~/.ssh/known_hosts

          skip_tags=""
          [ "${{ inputs.skip_base }}" = "true" ] && skip_tags="base"
          if [ "${{ inputs.skip_docker }}" = "true" ]; then
            skip_tags="${skip_tags:+$skip_tags,}docker"
          fi
          skip_args=()
          [ -n "$skip_tags" ] && skip_args=(--skip-tags "$skip_tags")

          # First run on a fresh box: root login still works, connect as
          # root (the users role hasn't hardened sshd yet). Re-run on an
          # already-provisioned box: root login is disabled, fall back to
          # the sudo-capable `mediscan` user (requires ADMIN_SSH_PRIVATE_KEY
          # to have been loaded above).
          if ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no root@"${{ inputs.host }}" true 2>/dev/null; then
            connect_user=root
            become_args=()
          else
            connect_user=mediscan
            become_args=(--become)
          fi
          echo "Connecting as $connect_user"

          ansible-playbook playbook.yml \
            -i "${{ inputs.host }}," \
            -u "$connect_user" \
            "${become_args[@]}" \
            -e @/tmp/mediscan-provision/extra-vars.json \
            "${skip_args[@]}"

      - name: Configure Cloudflare zone SSL settings
        run: |
          set -e

          patch_setting() {
            local setting="$1" data="$2"
            local response status body
            response=$(curl -s -w '\n%{http_code}' -X PATCH \
              "https://api.cloudflare.com/client/v4/zones/${{ vars.CLOUDFLARE_ZONE_ID }}/settings/${setting}" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data "$data")
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            echo "PATCH ${setting} -> HTTP ${status}"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "$body"
              exit 1
            fi
          }

          patch_setting ssl '{"value":"strict"}'
          patch_setting always_use_https '{"value":"on"}'
          # Certificate Transparency Monitoring is deliberately not automated
          # here - no confirmed simple zone-setting endpoint for it like the
          # two above; leave it as a one-time manual dashboard toggle.

      - name: Point DNS at this VPS (Cloudflare API - upsert by record name)
        run: |
          set -e
          for name in app.mediscan.cloud staging.mediscan.cloud cdn.mediscan.cloud cdnstaging.mediscan.cloud monitor.mediscan.cloud monitorstaging.mediscan.cloud; do
            existing_id=$(curl -sf -X GET \
              "https://api.cloudflare.com/client/v4/zones/${{ vars.CLOUDFLARE_ZONE_ID }}/dns_records?type=A&name=${name}" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" | jq -r '.result[0].id // empty')

            if [ -n "$existing_id" ]; then
              method="PUT"
              url="https://api.cloudflare.com/client/v4/zones/${{ vars.CLOUDFLARE_ZONE_ID }}/dns_records/${existing_id}"
            else
              method="POST"
              url="https://api.cloudflare.com/client/v4/zones/${{ vars.CLOUDFLARE_ZONE_ID }}/dns_records"
            fi

            curl -sf -X "$method" "$url" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"A\",\"name\":\"${name}\",\"content\":\"${{ inputs.host }}\",\"proxied\":true,\"ttl\":1}"
          done
