# Routes staging hostnames through production nginx to staging nginx
# (which listens on host ports 8080/8443). Mounted into the production
# nginx container only - staging nginx doesn't need this.

server {
    listen 80;
    server_name staging.mediscan.cloud cdnstaging.mediscan.cloud monitorstaging.mediscan.cloud;

    location /nginx-health {
        access_log off;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging.mediscan.cloud cdnstaging.mediscan.cloud monitorstaging.mediscan.cloud;

    ssl_certificate     /etc/nginx/tls/origin.crt;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
