server {
    listen 80;
    server_name cdn.mediscan.cloud cdn.staging.app.mediscan.cloud;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cdn.mediscan.cloud cdn.staging.app.mediscan.cloud;

    ssl_certificate     /etc/nginx/tls/origin.crt;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Docker's embedded DNS - resolved per-request via a variable (not a
    # static `upstream` block) so nginx doesn't refuse to start if rustfs
    # isn't resolvable yet at boot.
    resolver 127.0.0.11 valid=10s;

    location / {
        # Public CDN hostname is read-only - the app writes to RustFS
        # directly over the internal network (AWS_ENDPOINT=http://rustfs:9000),
        # never through this public hostname.
        limit_except GET HEAD {
            deny all;
        }

        set $rustfs_upstream rustfs:9000;
        proxy_pass http://$rustfs_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=86400";
    }
}
