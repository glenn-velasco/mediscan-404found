server {
    listen 80;
    server_name app.mediscan.cloud staging.mediscan.cloud;

    location /nginx-health {
        access_log off;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.mediscan.cloud staging.mediscan.cloud;

    ssl_certificate     /etc/nginx/tls/origin.crt;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    # Docker's embedded DNS - resolved per-request via variables below
    # (not a static `upstream` block) so nginx doesn't refuse to start if
    # a backend container isn't resolvable yet at boot.
    resolver 127.0.0.11 valid=10s;

    # Reverb WebSocket upgrade - browsers connect to wss://<this host>/app/{key}
    # (REVERB_HOST is set to this same public hostname); the backend
    # containers reach Reverb directly over the internal network instead
    # (REVERB_BROADCAST_HOST=reverb), so this is the only Reverb path that
    # needs to be public.
    location /app/ {
        set $reverb_upstream reverb:8080;
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 65s;
    }

    # Vite's hashed build output - content-addressed filenames, safe to
    # cache forever.
    location ^~ /build/ {
        set $app_upstream app:8000;
        proxy_pass http://$app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fixed-filename static assets (face-detection models, favicons,
    # robots.txt) - short cache with revalidation, NOT immutable, since
    # their filenames don't change if the content does.
    location ^~ /face-api-models/ {
        set $app_upstream app:8000;
        proxy_pass http://$app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location ~* ^/(favicon\.ico|favicon\.svg|apple-touch-icon\.png|robots\.txt)$ {
        set $app_upstream app:8000;
        proxy_pass http://$app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Everything else (web/api routes, /docs, /horizon) - dynamic, proxied
    # straight through with no caching.
    location / {
        set $app_upstream app:8000;
        proxy_pass http://$app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
