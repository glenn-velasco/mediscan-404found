; Kept in sync with nginx's client_max_body_size (infrastructure/docker/nginx/templates/app.conf.template)
; so PHP doesn't reject/truncate bodies nginx already accepted, which otherwise
; surfaces to clients as a 502 instead of a clean validation error.
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
