# Deployed by .github/workflows/deploy.yml via SSH - this file and the
# .env sitting next to it on the VPS (~/mediscan/production/) are the
# only two non-image artifacts deploy ever writes there. Image tags and
# secrets come entirely from .env, generated fresh on every deploy from the
# "production" GitHub Environment - never hardcoded here.

name: mediscan-production

services:
  app:
    image: ghcr.io/${GHCR_OWNER}/mediscan-app:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      CADDY_STORAGE_ROOT: /tmp/caddy
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]

  horizon:
    image: ghcr.io/${GHCR_OWNER}/mediscan-app:${IMAGE_TAG}
    command: php artisan horizon
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    # Overrides the image's default HEALTHCHECK (checks :8000/up, which
    # nothing listens on here) - horizon:status exits 0 only when Horizon
    # is actually running (1 if paused, 2 if inactive).
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]

  scheduler:
    image: ghcr.io/${GHCR_OWNER}/mediscan-app:${IMAGE_TAG}
    command: php artisan schedule:work
    restart: unless-stopped
    mem_limit: 256m
    env_file: .env
    # No equivalent status command for schedule:work - disable the
    # inherited image HEALTHCHECK (checks :8000/up) rather than report a
    # permanently false "unhealthy"; `restart: unless-stopped` already
    # covers the actual failure mode (process exits).
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]

  reverb:
    image: ghcr.io/${GHCR_OWNER}/mediscan-app:${IMAGE_TAG}
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    # Overrides the image's default HEALTHCHECK (checks :8000/up); this
    # service listens on :8080 instead.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy allkeys-lru
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data
    networks: [internal]

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    mem_limit: 64m
    environment:
      REDIS_ADDR: redis:6379
    networks: [internal]

  rustfs-permissions:
    image: busybox
    command: chown -R 10001:10001 /data/rustfs
    volumes:
      - rustfs_data:/data/rustfs
    networks: [internal]

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    mem_limit: 512m
    environment:
      RUSTFS_VOLUMES: /data/rustfs
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    volumes:
      - rustfs_data:/data/rustfs
    networks: [internal]

  face-match:
    image: ghcr.io/${GHCR_OWNER}/mediscan-face-match:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 1g
    environment:
      FACE_MATCH_SHARED_SECRET: ${FACE_MATCH_SHARED_SECRET}
    networks: [internal]

  nginx:
    image: ghcr.io/${GHCR_OWNER}/mediscan-nginx:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      NGINX_APP_HOST: app.mediscan.cloud
      NGINX_CDN_HOST: cdn.mediscan.cloud
      NGINX_MONITOR_HOST: monitor.mediscan.cloud
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/mediscan/tls:/etc/nginx/tls:ro
    depends_on:
      - app
      - reverb
      - rustfs
    networks: [public, internal]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    mem_limit: 64m
    environment:
      DATA_SOURCE_NAME: ${DB_URL}
    networks: [internal]

  prometheus:
    image: ghcr.io/${GHCR_OWNER}/mediscan-prometheus:${IMAGE_TAG}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - prometheus_data:/prometheus
    networks: [internal]

  grafana:
    image: ghcr.io/${GHCR_OWNER}/mediscan-grafana:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://monitor.mediscan.cloud
    volumes:
      - grafana_data:/var/lib/grafana
    networks: [internal] # exposed via nginx at monitor.mediscan.cloud

  loki:
    image: ghcr.io/${GHCR_OWNER}/mediscan-loki:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - loki_data:/loki
    networks: [internal]

  promtail:
    image: ghcr.io/${GHCR_OWNER}/mediscan-promtail:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    mem_limit: 64m
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks: [internal]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [internal]

networks:
  public:
  internal:

volumes:
  redis_data:
  rustfs_data:
  prometheus_data:
  grafana_data:
  loki_data:
