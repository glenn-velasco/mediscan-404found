        custom: []
        status: 403
        content: '{"status":403,"message":"Unauthorized.","errors":null}'
        headers: []
        description: ''
      -
        custom: []
        status: 404
        content: '{"status":404,"message":"Patient not found.","errors":null}'
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
