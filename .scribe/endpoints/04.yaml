name: 'Device Keys'
description: ''
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/device-keys
    metadata:
      custom: []
      groupName: 'Device Keys'
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: "Register or rotate a device's public key."
      description: |-
        The mobile app generates a public/private key pair (sodium sealed-box),
        registers its public key here, and uses the private key to decrypt
        envelopes received from professionals.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      public_key:
        custom: []
        name: public_key
        description: 'Base64-encoded sodium sealed-box public key (44 chars for 32-byte key).'
        required: true
        example: 1234567890abcdefghijklmnopqrstuvwxyzABCDEF12
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      label:
        custom: []
        name: label
        description: 'Device name/label (e.g., iPhone 15, Samsung Galaxy).'
        required: false
        example: 'iPhone 15'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
    cleanBodyParameters:
      public_key: 1234567890abcdefghijklmnopqrstuvwxyzABCDEF12
      label: 'iPhone 15'
    fileParameters: []
    responses:
      -
        custom: []
        status: 201
        content: '{"status":201,"message":"Success","data":{"id":1,"user_id":1,"public_key":"1234567890abcdefghijklmnopqrstuvwxyzABCDEF12","label":"iPhone 15","is_active":true,"registered_at":"2026-01-01T00:00:00.000000Z"}}'
        headers: []
        description: ''
      -
        custom: []
        status: 422
        content: '{"status":422,"message":"The public_key field must be 44 characters.","errors":{"public_key":["The public_key field must be 44 characters."]}}'
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - DELETE
    uri: 'api/v1/device-keys/{deviceKey_id}'
    metadata:
      custom: []
      groupName: 'Device Keys'
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Revoke a device key.'
      description: |-
        Mark a previously registered key as inactive/revoked.
        Envelopes encrypted to this key become unretrievable.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      deviceKey_id:
        custom: []
        name: deviceKey_id
        description: 'The ID of the deviceKey.'
        required: true
        example: 16
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanUrlParameters:
      deviceKey_id: 16
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"status":200,"message":"Device key revoked.","data":null}'
        headers: []
        description: ''
      -
        custom: []
        status: 403
        content: '{"status":403,"message":"This device key does not belong to you.","errors":null}'
        headers: []
        description: ''
      -
        custom: []
        status: 404
        content: '{"status":404,"message":"Not found.","errors":null}'
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
