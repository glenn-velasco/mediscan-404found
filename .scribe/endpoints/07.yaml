name: Professional
description: ''
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: 'api/v1/professional/patients/{patient_id}/public-key'
    metadata:
      custom: []
      groupName: Professional
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: "Fetch a patient's public key."
      description: |-
        Retrieve a specific patient's current active public key for offline scenario (scenario 1).
        Used by a professional's phone when initiating a P2P sync handshake over BLE/WiFi.
        The professional app encrypts the medical data to this key before sending locally.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      patient_id:
        custom: []
        name: patient_id
        description: 'The ID of the patient.'
        required: true
        example: 2
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanUrlParameters:
      patient_id: 2
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"status":200,"message":"Success","data":{"public_key":"1234567890abcdefghijklmnopqrstuvwxyzABCDEF12"}}'
        headers: []
        description: ''
      -
        custom: []
        status: 404
        content: '{"status":404,"message":"Patient has no registered device key.","errors":null}'
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: 'api/v1/professional/patients/{patient_id}/envelopes'
    metadata:
      custom: []
      groupName: Professional
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Submit an encrypted sync envelope for a patient.'
      description: |-
        Called when a professional scans a patient (QR/card) without the patient's device present (scenario 2).
        The `ciphertext` must already be encrypted client-side using the patient's public key (sealed-box).
        The server relays this opaque blob to the patient's device when it next comes online.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      patient_id:
        custom: []
        name: patient_id
        description: 'The ID of the patient.'
        required: true
        example: 2
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanUrlParameters:
      patient_id: 2
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      ciphertext:
        custom: []
        name: ciphertext
        description: 'Base64-encoded sealed-box ciphertext.'
        required: true
        example: abc123def456...
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      envelope_type:
        custom: []
        name: envelope_type
        description: 'Type/category of the payload. One of: allergy_verification, transfusion_witness, general_note.'
        required: true
        example: allergy_verification
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      ciphertext: abc123def456...
      envelope_type: allergy_verification
    fileParameters: []
    responses:
      -
        custom: []
        status: 201
        content: '{"status":201,"message":"Envelope submitted.","data":{"id":1,"sender_id":2,"recipient_id":3,"envelope_type":"allergy_verification","status":"pending","expires_at":"2026-10-08T00:00:00.000000Z","created_at":"2026-01-01T00:00:00.000000Z"}}'
        headers: []
        description: ''
      -
        custom: []
        status: 422
        content: '{"status":422,"message":"The ciphertext field is required.","errors":{"ciphertext":["The ciphertext field is required."]}}'
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
