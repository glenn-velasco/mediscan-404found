name: 'Emergency QR Events'
description: ''
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/emergency-qr/events
    metadata:
      custom: []
      groupName: 'Emergency QR Events'
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Log an emergency QR "shown" or "scanned" event for usage analytics.'
      description: |-
        Best-effort ping fired by the mobile app whenever a patient's emergency QR is presented
        or scanned; never blocks the offline read path. Reuses the generic audit_logs table —
        the backend stores no plaintext medical data.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      action:
        custom: []
        name: action
        description: 'Either "shown" or "scanned".'
        required: true
        example: scanned
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      patient_id:
        custom: []
        name: patient_id
        description: 'The patient whose emergency QR this event concerns.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      context:
        custom: []
        name: context
        description: 'The scanning context (e.g. viewer, professional_submit).'
        required: false
        example: professional_submit
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
    cleanBodyParameters:
      action: scanned
      patient_id: 1
      context: professional_submit
    fileParameters: []
