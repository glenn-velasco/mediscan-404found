endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/professional-applications
    metadata:
      custom: []
      groupName: 'Professional Applications'
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Submits a professional application for automatic + manual KYC review.'
      description: |-
        The selfie/flash frames are a liveness challenge, not a plain photo
        upload: `selfie_frames` must be a short burst spanning at least one
        real blink (eyes open -> closed -> open), and `flash_frames` must be
        captured while the client's own screen displayed each color in
        `flash_colors` in turn (e.g. flash red, capture a frame, flash green,
        capture a frame, ...). There is no face-api.js/browser dependency on
        the API side - clients are free to implement this capture flow
        however suits their platform (native camera APIs, a WebView, etc.);
        the server independently re-verifies both the blink and the color
        reflection in the uploaded frames, so client-side gating is only a UX
        nicety, never trusted as-is.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_KEY}'
      Content-Type: multipart/form-data
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      id_type:
        custom: []
        name: id_type
        description: 'One of: ph_prc.'
        required: true
        example: ph_prc
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      id_photo:
        custom: []
        name: id_photo
        description: 'Photo of the professional ID. jpg/jpeg/png, max 5MB.'
        required: true
        example: null
        type: file
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      selfie_frames:
        custom: []
        name: selfie_frames
        description: 'Burst of 3-10 selfie frames spanning at least one real blink. jpg/jpeg/png, max 3MB each.'
        required: true
        example:
          - null
        type: 'file[]'
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      flash_frames:
        custom: []
        name: flash_frames
        description: 'One selfie frame captured per entry in flash_colors, in the same order (3-10 frames). jpg/jpeg/png, max 3MB each.'
        required: true
        example:
          - null
        type: 'file[]'
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      flash_colors:
        custom: []
        name: flash_colors
        description: 'One of red/green/blue per entry, same length and order as flash_frames - the color that was on-screen when that frame was captured.'
        required: true
        example:
          - red
          - green
          - blue
        type: 'string[]'
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      coe:
        custom: []
        name: coe
        description: 'Certificate of Employment. pdf/jpg/jpeg/png, max 10MB.'
        required: true
        example: null
        type: file
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanBodyParameters:
      id_type: ph_prc
      flash_colors:
        - red
        - green
